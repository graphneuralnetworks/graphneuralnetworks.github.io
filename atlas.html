<!DOCTYPE html>
<html lang="en" class="graph-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas — Graph Neural Networks</title>
    <meta name="description" content="An interactive map of Graph Neural Network research — how the ideas connect, from spectral filters to graph transformers.">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="nav nav--on-paper">
        <a class="nav__brand" href="index.html">
            <img class="nav__logo" src="assets/images/cube.png" alt="">

        <div class="nav__links">
            <a href="index.html">Home</a>

    <main class="graph-full">
        <div class="graph-intro">
